version: 2
sources:
  - name: raw
    schema: gz_raw_data
    tables:
      - name: sales
        identifier: raw_gz_sales
        columns:
          - name: date_date
            description: date of purchase
          - name: orders_id
            description: id Of orders
            tests:
              - not_null
        tests:
          - unique: 
              column_name: "(orders_id || '-' || pdt_id)"
        loaded_at_field: "CAST(date_date AS TIMESTAMP)"
        freshness: 
          warn_after:
            count: 90
            period: day
        
         
            
      - name: product
        identifier: raw_gz_product
        columns:
          - name: products_id
            description: unique identifier for products
            tests:
              - unique
              - not_null
          - name: purchSE_PRICE
            description: purchase price of the product
      - name: ship
        identifier: raw_gz_ship
        columns:
          - name: orders_id
            description: unique identifier for orders
            tests:
              - unique
              - not_null
          - name: shipping_fee
            description: shipping fee amount
          - name: ship_cost
            description: shipping cost
